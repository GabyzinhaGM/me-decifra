<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Me Decifra</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <!-- HOME -->
    <div id="home">

      <h1 class="title">
        Me Decifra
      </h1>

      <p class="subtitle">
        Descubra quem realmente conhece mais o outro 🔥
      </p>

      <input
        type="text"
        id="playerName"
        placeholder="Seu nome"
        aria-label="Seu nome"
      >

      <select id="gameMode">

        <option value="casal">
          💘 Modo Casal
        </option>

        <option value="amigos">
          👥 Modo Amigos
        </option>

      </select>

      <button onclick="createRoom()">
        Criar Sala
      </button>

      <input
        type="text"
        id="roomInput"
        placeholder="Código da sala"
        aria-label="Código da sala"
      >

      <button onclick="joinRoom()">
        Entrar na Sala
      </button>

    </div>

    <!-- WAITING -->
    <div
      id="waiting"
      class="hidden"
    >

      <h1>
        Sala criada 🎉
      </h1>

      <p>
        Compartilhe o código:
      </p>

      <div
        id="roomCode"
        class="room-code"
      ></div>

      <button onclick="startQuestions()">
        Começar
      </button>

    </div>

    <!-- QUESTIONS -->
    <div
      id="questionsScreen"
      class="hidden"
    >

      <h2 id="phrase"></h2>

      <div
        id="timer"
        class="timer"
        aria-live="polite"
      ></div>

      <div id="questions"></div>

      <button onclick="saveAnswers()">
        Finalizar respostas
      </button>

    </div>

    <!-- RESULT -->
    <div
      id="resultScreen"
      class="hidden"
    >

      <h1>
        Resultado Final 🏆
      </h1>

      <div
        id="score"
        aria-live="polite"
      ></div>

      <div id="answers"></div>

      <button onclick="location.reload()">
        Jogar novamente
      </button>

    </div>

  </div>

  <!-- SONS -->
  <audio
    id="clickSound"
    src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"
  ></audio>

  <audio
    id="successSound"
    src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"
  ></audio>

  <audio
    id="timerSound"
    src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
  ></audio>

  <audio
    id="winSound"
    src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"
  ></audio>

  <script
    type="module"
    src="script.js"
  ></script>

</body>

</html>
