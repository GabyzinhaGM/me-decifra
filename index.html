<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Me Decifra
  </title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <!-- HOME -->
    <div id="home">

      <h1>
        Me Decifra 🔥
      </h1>

      <p>
        Descubra quem realmente conhece mais o outro.
      </p>

      <input
        type="text"
        id="playerName"
        placeholder="Digite seu nome"
        aria-label="Digite seu nome"
      >

      <select
        id="gameMode"
        aria-label="Modo de jogo"
      >

        <option value="casal">
          💘 Modo Casal
        </option>

        <option value="amigos">
          😎 Modo Amigos
        </option>

      </select>

      <button onclick="createRoom()">
        Criar Sala
      </button>

      <input
        type="text"
        id="roomInput"
        placeholder="Digite o código da sala"
        aria-label="Código da sala"
      >

      <button onclick="joinRoom()">
        Entrar na Sala
      </button>

    </div>

    <!-- ESPERA -->
    <div
      id="waiting"
      class="hidden"
    >

      <h1>
        Sala criada 🎉
      </h1>

      <p>
        Compartilhe este código:
      </p>

      <div
        class="room-code"
        id="roomCode"
      ></div>

      <button onclick="startQuestions()">
        Começar
      </button>

    </div>

    <!-- PERGUNTAS -->
    <div
      id="questionsScreen"
      class="hidden"
    >

      <h2 id="phrase"></h2>

      <div id="timer"></div>

      <div id="questions"></div>

      <button onclick="saveAnswers()">
        Finalizar respostas
      </button>

    </div>

    <!-- RESULTADO -->
    <div
      id="resultScreen"
      class="hidden"
    >

      <h1>
        Resultado Final 🏆
      </h1>

      <div id="score"></div>

      <div id="answers"></div>

      <button onclick="location.reload()">
        Jogar novamente
      </button>

    </div>

  </div>

  <!-- SONS -->

  <audio
    id="clickSound"
    src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3"
  ></audio>

  <audio
    id="successSound"
    src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_270f49b7b1.mp3"
  ></audio>

  <audio
    id="timerSound"
    src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_85c5d1c9ab.mp3"
  ></audio>

  <audio
    id="winSound"
    src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_401b5c92b4.mp3"
  ></audio>

  <!-- SCRIPT -->

  <script
    type="module"
    src="script.js"
  ></script>

</body>

</html>
